name: CI + Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npx vitest run --reporter=default --reporter=json --outputFile.json=reports/test-results.json
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-tests
          path: reports/
          if-no-files-found: ignore

  snyk:
    name: Snyk (Code + Open Source + IaC + Container)
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check Snyk token is configured
        id: secrets
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::warning::SNYK_TOKEN not set. Skipping Snyk scan."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: snyk/actions/setup@master
        if: steps.secrets.outputs.ok == 'true'
      - run: npm ci && mkdir -p reports
        if: steps.secrets.outputs.ok == 'true'
      # Security gate: fail on High or Critical. Each step runs even if a previous one failed.
      # The *-file-output flags keep the normal console output and also save results for report.html.
      - name: SAST (Snyk Code)
        if: steps.secrets.outputs.ok == 'true'
        run: snyk code test --severity-threshold=high --sarif-file-output=reports/snyk-code.sarif
      - name: SCA (Snyk Open Source)
        if: always() && steps.secrets.outputs.ok == 'true'
        run: snyk test --severity-threshold=high --json-file-output=reports/snyk-oss.json
      - name: IaC (Snyk IaC)
        if: always() && steps.secrets.outputs.ok == 'true'
        run: snyk iac test k8s --severity-threshold=high --json-file-output=reports/snyk-iac.json
      - name: Build Docker image
        id: image
        if: always() && steps.secrets.outputs.ok == 'true'
        run: docker build -t poc-app:${{ github.sha }} .
      - name: Container (Snyk Container)
        if: always() && steps.secrets.outputs.ok == 'true' && steps.image.outcome == 'success'
        # --exclude-app-vulns: npm packages are already covered by the SCA step; here we check the image itself
        run: >-
          snyk container test poc-app:${{ github.sha }} --file=Dockerfile --exclude-app-vulns
          --severity-threshold=high --json-file-output=reports/snyk-container.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-snyk
          path: reports/
          if-no-files-found: ignore

  # Builds one report.html from all results, shows a summary on the run page, and posts the
  # overall result as a commit status so it appears on the PR (also for workflow_dispatch runs).
  report:
    name: Report (HTML + PR status)
    needs: [build-test, snyk]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: reports
          merge-multiple: true
      - name: Build report.html
        env:
          BUILD: ${{ needs.build-test.result }}
          SNYK: ${{ needs.snyk.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: node scripts/build-report.mjs reports report/report.html >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: report/report.html
      - name: Set commit status
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ needs.build-test.result }}
          SNYK: ${{ needs.snyk.result }}
        run: |
          if [ "$BUILD" = success ] && [ "$SNYK" = success ]; then
            state=success; desc="Tests and Snyk security gate passed"
          else
            state=failure; desc="Blocked: build-test=$BUILD, snyk=$SNYK"
          fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" -f context="CI + Security Gate" -f description="$desc" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Fail this job too when the gate is blocked, so it is red in the Actions UI
          [ "$state" = success ]
